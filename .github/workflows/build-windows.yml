name: Build Windows exe

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Model files of the pose backends (rtmlib, PyTorch hub, Hugging Face, YOLO / MoveNet in
      # models/, test downloads): kept between runs so the real-model tests do not download
      # ~2 GB every time
      - name: Cache pose models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rtmlib
            ~/.cache/torch
            ~/.cache/huggingface
            ~/.cache/poseboard-tests
            models
          key: pose-models-${{ runner.os }}-${{ hashFiles('poseboard/pose/detectors/*.py') }}
          restore-keys: pose-models-${{ runner.os }}-

      # The exe is built from this environment: base requirements plus the torch-free rtmlib /
      # ONNX Runtime backends. The PyTorch stack is installed only later, for the tests.
      - name: Install dependencies (base + rtmlib / ONNX Runtime)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "rtmlib>=0.0.16" "onnxruntime>=1.16"
          pip install pytest pyinstaller
          pip uninstall -y opencv-python opencv-python-headless
          pip install --force-reinstall --no-deps opencv-contrib-python
          pip list
          python -c "import cv2, rtmlib, onnxruntime; print('OpenCV', cv2.__version__, '| ONNX Runtime', onnxruntime.__version__)"

      # The configuration of the exe (no PyTorch, Ultralytics, transformers): "not installed"
      # entries, clean skips of the optional backends and the registry defaults without them
      - name: Run tests (base + rtmlib, the exe's environment)
        run: python -m pytest -q -rs tests

      - name: Download MediaPipe pose model (bundled into the exe)
        run: python -c "from poseboard.pose.mediapipe_backend import ensure_model; print(ensure_model('full'))"

      - name: Build with PyInstaller (the spec leaves out PyTorch, Ultralytics, transformers, MMPose)
        run: pyinstaller installer/poseboard.spec --noconfirm

      - name: Self-test PoseBoard.exe (GUI, headless; runs the real rtmlib models)
        shell: pwsh
        env:
          POSEBOARD_SELFTEST_DOWNLOAD: "1"
        run: |
          $p = Start-Process -FilePath dist\PoseBoard\PoseBoard.exe -ArgumentList '--selftest' -Wait -PassThru
          if (Test-Path dist\PoseBoard\poseboard.log) { Get-Content dist\PoseBoard\poseboard.log; Remove-Item dist\PoseBoard\poseboard.log }
          if ($p.ExitCode -ne 0) { throw "PoseBoard.exe --selftest failed with exit code $($p.ExitCode)" }

      - name: Self-test PoseBoard-Wii.exe (simulated board)
        shell: pwsh
        run: |
          dist\PoseBoard\PoseBoard-Wii.exe --simulate --seconds 2 --out $env:RUNNER_TEMP\wii_selftest
          if ($LASTEXITCODE -ne 0) { throw "PoseBoard-Wii.exe failed with exit code $LASTEXITCODE" }
          $csv = Get-ChildItem -Recurse $env:RUNNER_TEMP\wii_selftest -Filter wii.csv | Select-Object -First 1
          if (-not $csv) { throw "wii.csv was not written" }
          Get-Content $csv.FullName -TotalCount 3

      # All pose backends for the tests (CPU PyTorch from PyPI), so the real-model smoke tests
      # and tests/test_backends_consistency.py run with internet access; they skip (with the
      # reason) only when a model cannot be downloaded
      - name: Install the optional pose backends for the tests
        run: |
          pip install -r requirements-extras.txt
          pip uninstall -y opencv-python opencv-python-headless
          pip install --force-reinstall --no-deps opencv-contrib-python
          python -c "import cv2, torch, torchvision, ultralytics, transformers, rtmlib, onnxruntime; print('OpenCV', cv2.__version__, '| torch', torch.__version__, '| ultralytics', ultralytics.__version__, '| transformers', transformers.__version__)"

      - name: Run tests (all backends)
        run: python -m pytest -q -rs tests

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md dist\PoseBoard\
          Compress-Archive -Path dist\PoseBoard -DestinationPath PoseBoard-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PoseBoard-windows-x64
          path: PoseBoard-windows-x64.zip
          retention-days: 30

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PoseBoard-windows-x64.zip
