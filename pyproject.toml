[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poseboard"
dynamic = ["version"]
description = "Synchronized recording of 3D human pose (webcams) and Wii Balance Board force / center-of-pressure data"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["wii balance board", "center of pressure", "posturography", "pose estimation",
            "center of mass", "biomechanics", "mediapipe"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "opencv-contrib-python>=4.8",
    "PySide6>=6.5",
    "hidapi>=0.14",
    "mediapipe>=0.10.14",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
poseboard = "poseboard.gui.app:main"
poseboard-analysis = "poseboard.analysis:main"
poseboard-wii = "poseboard.wii.record:main"

[tool.setuptools.dynamic]
version = { attr = "poseboard.__version__" }

[tool.setuptools.packages.find]
include = ["poseboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
