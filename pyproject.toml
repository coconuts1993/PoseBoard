[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poseboard"
dynamic = ["version"]
description = "Synchronized recording of 3D human pose (webcams) and Wii Balance Board force / center-of-pressure data"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["wii balance board", "center of pressure", "posturography", "pose estimation",
            "center of mass", "biomechanics", "mediapipe"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "opencv-contrib-python>=4.8",
    "PySide6>=6.5",
    "hidapi>=0.14",
    "mediapipe>=0.10.14",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Optional 2D pose backends (README, "2D pose backends"). After installing rtmlib or yolo,
# restore a single OpenCV build: pip uninstall -y opencv-python opencv-python-headless, then
# pip install --force-reinstall --no-deps opencv-contrib-python
rtmlib = ["rtmlib>=0.0.16", "onnxruntime>=1.16"]
yolo = ["ultralytics>=8.4"]  # 8.4: first release with YOLO26
torchvision = ["torch>=2.1", "torchvision>=0.16"]
vitpose = ["transformers>=4.48", "torch>=2.1", "torchvision>=0.16"]
all = ["rtmlib>=0.0.16", "onnxruntime>=1.16", "ultralytics>=8.4", "torch>=2.1",
       "torchvision>=0.16", "transformers>=4.48"]

[project.scripts]
poseboard = "poseboard.gui.app:main"
poseboard-analysis = "poseboard.analysis:main"
poseboard-wii = "poseboard.wii.record:main"

[tool.setuptools.dynamic]
version = { attr = "poseboard.__version__" }

[tool.setuptools.packages.find]
include = ["poseboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
